name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  lint-and-format:
    name: Py code quality inspection
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Py environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: ruff check .

    - name: Check code formatting consistency
      run: ruff format --check .


  run-tests:
    name: Microservice logic verification
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Py environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install subfolder project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r LocalProductOpt/requirements.txt

    - name: Execute isolated app suite by Pytest
      env:
        PYTHONPATH: LocalProductOpt
      run: |
        pytest LocalProductOpt/app/tests/