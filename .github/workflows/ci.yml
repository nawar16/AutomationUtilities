name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  lint-and-format:
    name: Py code quality inspection
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Py environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: ruff check .

    - name: Check code formatting consistency
      run: ruff format --check .


  run-tests:
    name: Microservice logic verification
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Py environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install subfolder project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -r LocalProductOpt/requirements.txt
        pip install -r TaxVatValidator/requirements.txt

    - name: Execute product optimizer tests
      env:
        PYTHONPATH: LocalProductOpt
      run: |
        pytest LocalProductOpt/app/tests/
    
    - name: Execute tax validator tests
      env:
        PYTHONPATH: TaxVatValidator
      run: |
        pytest TaxVatValidator/tests/

  
  validate-container:
    name: Docker runtime validation
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and start containers via Docker Compose
      run: |
        docker compose up -d --build

    - name: Wait for API Boot & health verification
      run: |
        for i in {1..10}; do
          curl -s http://localhost:8000/docs && break || sleep 2
        done

    - name: Fire structural API payload verification check
      run: |
        RESPONSE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/optimize/shopware-payload" \
          -H "Content-Type: application/json" \
          -d '{
            "sku": "CI-TEST-01",
            "name": "Heavy Duty Iron Hammer",
            "description": "```html <p>Strong hammer for construction work.</p> <script>alert(1)</script> ```",
            "price": 23.80,
            "taxId": "e5b123"
          }')
        
        echo "API Container responded with HTTP status code: $RESPONSE_STATUS"
        
        #500 is expected
        if [ "$RESPONSE_STATUS" -ne 500 ]; then
          echo "Error: Unexpected container communication crash or routing malfunction."
          exit 1
        fi
        echo "Container layer processing verified successfully."

    - name: Stream container logs on complete hook
      if: always()
      run: |
        docker compose logs optimizer-api
        docker compose down